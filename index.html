<!DOCTYPE html>
<html>
<head>
    <title>KChess</title>

    <style>
        body {
            background: #111827;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            font-size: 45px;
        }

        #board {
            width: 480px;
            height: 480px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
        }

        .square {
            width: 60px;
            height: 60px;
            font-size: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .light {
            background: #f0d9b5;
        }

        .dark {
            background: #b58863;
        }
    </style>
</head>

<body>

    <h1>♟️ KChess</h1>

    <div id="board"></div>

    <script>
        const pieces = [
            "♜","♞","♝","♛","♚","♝","♞","♜",
            "♟","♟","♟","♟","♟","♟","♟","♟",
            "","","","","","","","",
            "","","","","","","","",
            "","","","","","","","",
            "","","","","","","","",
            "♙","♙","♙","♙","♙","♙","♙","♙",
            "♖","♘","♗","♕","♔","♗","♘","♖"
        ];

        const board = document.getElementById("board");

        for (let i = 0; i < 64; i++) {
            const square = document.createElement("div");

            square.classList.add("square");

            if ((Math.floor(i / 8) + i) % 2 === 0) {
                square.classList.add("light");
            } else {
                square.classList.add("dark");
            }

            square.textContent = pieces[i];

            board.appendChild(square);
        }
    </script>

</body>
</html>
